name: Nibbl AI PR Checks

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  # Detect which services changed so each area's checks run only when its own
  # code changed (a backend-only PR no longer rebuilds the AI image, etc.).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ai: ${{ steps.filter.outputs.ai }}
      infra: ${{ steps.filter.outputs.infra }}
      webapps: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/backend/**'
            ai:
              - 'services/ai/**'
            website:
              - 'services/website/**'
              - 'deployment/docker/nextjs.Dockerfile'
            brand:
              - 'services/brand/**'
              - 'deployment/docker/nextjs.Dockerfile'
            admin:
              - 'services/admin/**'
              - 'deployment/docker/nextjs.Dockerfile'
            infra:
              - 'infrastructure/**'
              - 'deployment/**'
              - '.github/workflows/**'

  # Independent jobs so a failure in one service's checks never blocks or
  # skips another's -- each area's status reflects only its own code.
  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: |
          cd services/backend
          uv export --no-dev --frozen > requirements.txt
          pip install -r requirements.txt

      - name: Run Django checks
        run: |
          cd services/backend
          python manage.py check --settings=core.settings.test

      - name: Run backend tests
        env:
          # Tests mock the outbound httpx.post call itself; this just needs to
          # be non-empty so the "OCR not configured" guard doesn't short-circuit
          # the happy-path tests (a dedicated test covers the empty case via
          # @override_settings).
          RECEIPT_OCR_API_URL: http://localhost:8001
          RECEIPT_OCR_API_KEY: test-key
        run: |
          cd services/backend
          python manage.py test --settings=core.settings.test

      - name: Validate backend Dockerfile
        run: |
          set -o pipefail
          docker build --no-cache --target builder -f services/backend/Dockerfile ./services/backend 2>&1 | tail -5

  ai:
    name: AI Service
    needs: changes
    if: ${{ needs.changes.outputs.ai == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for AI
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.12"

      - name: Run AI checks
        working-directory: services/ai
        run: uv run --frozen --extra dev make check

      - name: Validate AI Dockerfile
        run: |
          set -o pipefail
          docker build --no-cache --target runtime -f services/ai/Dockerfile ./services/ai 2>&1 | tail -5

      - name: Validate AI Compose file
        run: docker compose -f services/ai/docker-compose.yml config --quiet

  infra:
    name: Infra Validation
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Compose Validation ───────────────────────────────────────
      - name: Validate docker-compose files
        run: |
          docker compose \
            -f deployment/compose/docker-compose.base.yml \
            -f deployment/compose/local/docker-compose.yml config --quiet

      # ─── Terraform Validate ───────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infrastructure/terraform/

      - name: Terraform Validate (production)
        run: |
          cd infrastructure/terraform/environments/production
          terraform init -backend=false
          terraform validate

  # Builds each changed web app's production image (no push) so a broken
  # build is caught before merge instead of in frontend-deploy.yml.
  webapp:
    name: Web app ${{ matrix.app }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        app: [website, brand, admin]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        if: ${{ contains(fromJSON(needs.changes.outputs.webapps), matrix.app) }}
        uses: actions/checkout@v4

      - name: Build production image
        if: ${{ contains(fromJSON(needs.changes.outputs.webapps), matrix.app) }}
        run: docker build -f deployment/docker/nextjs.Dockerfile services/${{ matrix.app }}
