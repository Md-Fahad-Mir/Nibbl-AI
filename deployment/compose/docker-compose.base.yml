# ─── Base Compose ─────────────────────────────────────────────────────
# Shared service definitions inherited by local/staging/production.
# Usage: docker compose -f docker-compose.base.yml -f <env>/docker-compose.yml up

x-common-env: &common-env
  restart: unless-stopped

services:

  backend:
    <<: *common-env
    container_name: ${PROJECT_NAME:-nibblai}-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

volumes:
  media_data:
    driver: local
  static_data:
    driver: local

networks:
  app-network:
    driver: bridge
