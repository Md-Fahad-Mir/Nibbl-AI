# ─── Nibbl AI Production Nginx Configuration ────────────────────────────
# Ansible renders this as a Jinja template; {{ website_domain }} comes
# from group_vars. Certbot auto-adds the SSL (443) blocks in Stage 7.


# Backend API (Django REST Framework)
server {
    listen 80;
    server_name api.{{ website_domain }};
    client_max_body_size 100M;

    include /etc/nginx/conf.d/security-headers.conf;

    location / {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://localhost:8000;
        limit_req zone=api_limit burst=20 nodelay;
    }

    location /static/ {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://localhost:8000;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://localhost:8000;
        proxy_cache_valid 200 30m;
        expires 30m;
    }

    # AI / Receipt-OCR service (services/ai). Container publishes only to
    # 127.0.0.1 by design; this route is what makes it reachable publicly,
    # over this same domain's TLS cert. ROOT_PATH=/ai on the ai container
    # keeps the OpenAPI schema and docs UI consistent with this prefix.
    location /ai/ {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://localhost:8001/;
        client_max_body_size 12m;
        proxy_read_timeout 120s;
        limit_req zone=api_limit burst=20 nodelay;
    }
}


