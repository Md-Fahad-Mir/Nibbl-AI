# ─── Nibbl AI Production Nginx — web apps ─────────────────────────────
# Installed on the box as /etc/nginx/sites-available/nibblai-frontends
# (separate from the API site so certbot's edits to either stay apart).
# Each app runs as its own container bound to 127.0.0.1 (see
# .github/workflows/frontend-deploy.yml). Certbot adds the 443 blocks:
#   sudo certbot --nginx -d www.joinnibbl.com -d brand.joinnibbl.com -d admin.joinnibbl.com
#
# The API's security-headers.conf is NOT included: its CSP (default-src 'self')
# would block calls to api.joinnibbl.com, Stripe.js and the Meta Pixel.

# Shopper website
server {
    listen 80;
    server_name www.joinnibbl.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://127.0.0.1:3003;
    }
}

# Brand dashboard
server {
    listen 80;
    server_name brand.joinnibbl.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://127.0.0.1:3001;
    }
}

# Admin dashboard
server {
    listen 80;
    server_name admin.joinnibbl.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://127.0.0.1:3002;
    }
}
