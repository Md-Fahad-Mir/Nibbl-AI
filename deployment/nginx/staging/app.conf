# ─── Nibbl AI Staging Nginx Configuration ───────────────────────────────
# Same structure as production but for staging.{{DOMAIN}} subdomains.

server {
    listen 80;
    server_name api.staging.{{DOMAIN}};
    client_max_body_size 100M;

    include /etc/nginx/conf.d/security-headers.conf;

    location / {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://localhost:8000;
        limit_req zone=api_limit burst=20 nodelay;
    }

    # AI / Receipt-OCR service (services/ai). ROOT_PATH=/ai on the ai
    # container keeps the OpenAPI schema and docs UI consistent with this
    # prefix.
    location /ai/ {
        include /etc/nginx/conf.d/proxy-params.conf;
        proxy_pass http://localhost:8001/;
        client_max_body_size 12m;
        proxy_read_timeout 120s;
        limit_req zone=api_limit burst=20 nodelay;
    }
}
